[package]
name = "crossbar"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
candle = { package = "candle-core", git = "https://github.com/huggingface/candle.git", version = "0.11.0" }
candle-nn = { git = "https://github.com/huggingface/candle.git", version = "0.11.0" }
clap = { version = "4", features = ["derive"] }
minijinja = { version = "2", features = ["serde"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = "0.21"
